name: NorthCUAWeb
llm_config:
  model: local-screen
  base_url: http://127.0.0.1:4000/v1
  api_key: ${env.OPENAI_API_KEY}
  api_type: openai_chat_completion
  max_tokens: 8192
  max_context_tokens: 128000
  max_retries: 3
  timeout: 120
max_iterations: 1
mcp_servers:
- name: WebAgentProbeExecutor
  model_visible: false
  type: in-memory
- name: WebAgentActionExecutor
  model_visible: true
  type: in-memory
