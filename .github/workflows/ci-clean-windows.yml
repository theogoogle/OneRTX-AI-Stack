name: Clean Windows Install & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  clean-windows-install:
    runs-on: windows-latest
    steps:
      - name: Checkout OneRTX-AI-Stack
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Privacy & Secret Gate
        shell: python
        run: |
          import re, subprocess, sys
          from pathlib import Path

          files = subprocess.check_output(["git", "ls-files"]).decode("utf-8", "replace").splitlines()
          pats = [
              ("email_address", re.compile(r"\b[A-Za-z0-9._%+-]+@(?:gmail|googlemail|yahoo|outlook|hotmail|icloud|proton)\.[a-z]{2,}\b", re.I)),
              ("secret_prefix", re.compile(r"\b(?:tvly-[A-Za-z0-9_-]{12,}|sk-[A-Za-z0-9_-]{20,}|AIza[A-Za-z0-9_-]{25,}|ghp_[A-Za-z0-9]{20,}|ya29\.[A-Za-z0-9_-]{20,}|GOCSPX-[A-Za-z0-9_-]{10,})\b")),
              ("google_sheet_url", re.compile(r"docs\.google\.com/spreadsheets/d/[A-Za-z0-9_-]{20,}")),
              ("windows_user_path", re.compile(r"[A-Za-z]:\\Users\\(?!<user>|%USERPROFILE%|WDAGUtilityAccount)[^\s\\/'\"<>]+", re.I)),
          ]
          bad = 0
          for f in files:
              if f == ".github/workflows/ci-clean-windows.yml":
                  continue
              p = Path(f)
              if not p.is_file() or p.stat().st_size > 2_000_000:
                  continue
              try:
                  txt = p.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              hits = [name for name, rx in pats if rx.search(txt)]
              if hits:
                  bad += 1
                  print(f"BLOCKED {f}: {', '.join(hits)}")
          if bad:
              sys.exit(1)
          print(f"Privacy/Secret scan clean across {len(files)} tracked file(s).")

      - name: Prerequisite CheckOnly Probe
        shell: pwsh
        run: |
          .\install.ps1 -CheckOnly -All -NonInteractive

      - name: Clean-Machine Install (Core + PowerTools + CodingAgents + ComputerUse configs)
        shell: pwsh
        run: |
          $sandbox = Join-Path $env:RUNNER_TEMP 'onertx-clean'
          .\install.ps1 -InstallDir $sandbox -WithPowerTools -WithCodingAgents -WithComputerUse -SkipSystemInstalls -SkipModels -SkipScheduledTask -NonInteractive -RouterPort 14000 -WebUIPort 18282

      - name: Idempotency Re-Run Check
        shell: pwsh
        run: |
          $sandbox = Join-Path $env:RUNNER_TEMP 'onertx-clean'
          .\install.ps1 -InstallDir $sandbox -WithPowerTools -WithCodingAgents -WithComputerUse -SkipSystemInstalls -SkipModels -SkipScheduledTask -SkipWebUIPip -NonInteractive -RouterPort 14000 -WebUIPort 18282

      - name: Post-Install Verification Suite (py_compile + unit tests + mock LM Studio router E2E)
        shell: pwsh
        run: |
          $sandbox = Join-Path $env:RUNNER_TEMP 'onertx-clean'
          python -I -X utf8 .\verify.py --install-dir $sandbox --router-port 14000 --mock-lmstudio --run-unit-tests
